<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #07070c;
      --bg-secondary: #0e0e16;
      --bg-card: rgba(255, 255, 255, 0.045);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --bg-nav: rgba(12, 12, 20, 0.85);
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.13);
      --text-primary: #f2f2f7;
      --text-secondary: #9a9aab;
      --text-muted: #5e5e6e;
      --accent: #7c9cff;
      --accent-soft: rgba(124, 156, 255, 0.14);
      --accent-glow: rgba(124, 156, 255, 0.28);
      --success: #5eead4;
      --warning: #fbbf24;
      --glass-blur: 28px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      --radius: 18px;
      --radius-sm: 12px;
      --nav-height: 72px;
      --top-height: 52px;
    }

    [data-theme="light"] {
      --bg-primary: #f0f1f5;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.75);
      --bg-card-hover: rgba(255, 255, 255, 0.92);
      --bg-nav: rgba(255, 255, 255, 0.9);
      --border: rgba(0, 0, 0, 0.06);
      --border-strong: rgba(0, 0, 0, 0.1);
      --text-primary: #1a1a28;
      --text-secondary: #5a5a6e;
      --text-muted: #8a8a9a;
      --accent: #4f6ef7;
      --accent-soft: rgba(79, 110, 247, 0.12);
      --accent-glow: rgba(79, 110, 247, 0.22);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 15% 30%, rgba(124, 156, 255, 0.07), transparent),
        radial-gradient(ellipse 50% 35% at 85% 70%, rgba(94, 234, 212, 0.04), transparent);
      pointer-events: none;
      z-index: 0;
    }

    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 70% 45% at 15% 30%, rgba(79, 110, 247, 0.05), transparent),
        radial-gradient(ellipse 50% 35% at 85% 70%, rgba(94, 234, 212, 0.03), transparent);
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .top-bar {
      height: var(--top-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    [data-theme="light"] .top-bar {
      background: rgba(255,255,255,0.4);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 180px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status-item svg {
      width: 15px;
      height: 15px;
      opacity: 0.85;
    }

    .top-center {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 180px;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .icon-btn svg { width: 16px; height: 16px; }

    .alarm-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--accent-soft);
      border: 1px solid rgba(124, 156, 255, 0.2);
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    .alarm-chip svg { width: 13px; height: 13px; }

    .main-area {
      flex: 1;
      overflow: hidden;
      position: relative;
      padding: 24px 28px 16px;
    }

    .view {
      display: none;
      height: 100%;
      animation: fadeIn 0.3s ease;
    }

    .view.active { display: flex; flex-direction: column; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      height: 100%;
    }

    .clock-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      position: relative;
      overflow: hidden;
    }

    .clock-card::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -40%;
      width: 180%;
      height: 180%;
      background: radial-gradient(circle at center, var(--accent-soft), transparent 55%);
      opacity: 0.6;
      pointer-events: none;
    }

    .clock-types {
      display: flex;
      gap: 6px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .clock-type-btn {
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .clock-type-btn:hover { color: var(--text-secondary); border-color: var(--border-strong); }
    .clock-type-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .clock-digital { position: relative; z-index: 1; text-align: center; }
    .time-main {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(56px, 8vw, 88px);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .time-seconds {
      font-size: 0.32em;
      color: var(--text-muted);
      margin-left: 4px;
    }
    .time-period {
      font-size: 0.26em;
      color: var(--text-secondary);
      margin-left: 10px;
      letter-spacing: 0.06em;
    }
    .time-sub {
      margin-top: 14px;
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }

    .clock-analog {
      display: none;
      position: relative;
      z-index: 1;
      width: 240px;
      height: 240px;
    }
    .clock-analog.active { display: block; }
    .analog-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      position: relative;
      background: var(--bg-card);
    }
    .analog-center {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .analog-hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }
    .hand-hour { width: 3.5px; height: 28%; background: var(--text-primary); margin-left: -1.75px; }
    .hand-minute { width: 2.5px; height: 38%; background: var(--text-secondary); margin-left: -1.25px; }
    .hand-second { width: 1.5px; height: 42%; background: var(--accent); margin-left: -0.75px; }
    .analog-mark {
      position: absolute;
      width: 2px; height: 8px;
      background: var(--text-muted);
      left: 50%; margin-left: -1px;
      transform-origin: center 120px;
    }
    .analog-mark.major {
      height: 12px; width: 2.5px; margin-left: -1.25px;
      background: var(--text-secondary);
    }

    .clock-minimal { display: none; position: relative; z-index: 1; text-align: center; }
    .clock-minimal.active { display: block; }
    .minimal-time {
      font-size: clamp(42px, 6vw, 64px);
      font-weight: 300;
      letter-spacing: 0.1em;
    }
    .minimal-label {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .side-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .weather-card, .music-mini {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--shadow);
      padding: 22px;
      transition: background 0.25s ease;
    }
    .weather-card:hover, .music-mini:hover { background: var(--bg-card-hover); }

    .weather-card { flex: 1; display: flex; flex-direction: column; }

    .card-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .weather-main {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }
    .weather-icon svg {
      width: 48px; height: 48px;
      color: var(--accent);
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }
    .temp-value {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .temp-unit { font-size: 18px; color: var(--text-secondary); }
    .weather-desc {
      margin-top: 4px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }
    .weather-detail {
      background: rgba(255,255,255,0.03);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      border: 1px solid var(--border);
    }
    [data-theme="light"] .weather-detail { background: rgba(0,0,0,0.025); }
    .detail-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
    .detail-value { font-size: 14px; font-weight: 500; }

    .music-mini {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }
    .album-art-sm {
      width: 52px; height: 52px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2a2a3a, #1a1a28);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .album-art-sm svg { width: 22px; height: 22px; opacity: 0.5; }
    .track-info-sm { flex: 1; min-width: 0; }
    .track-title-sm {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist-sm {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .play-btn-sm {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 12px var(--accent-glow);
      transition: transform 0.2s;
    }
    .play-btn-sm:hover { transform: scale(1.06); }
    .play-btn-sm svg { width: 16px; height: 16px; }

    .music-view {
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .music-large {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--shadow);
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 420px;
      width: 100%;
    }
    .album-art-lg {
      width: 200px; height: 200px;
      border-radius: 16px;
      background: linear-gradient(145deg, #2a2a3a 0%, #1a1a28 100%);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .album-art-lg svg { width: 56px; height: 56px; opacity: 0.4; }
    .track-title-lg {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
    }
    .track-artist-lg {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: -16px;
    }
    .progress-wrap { width: 100%; }
    .progress-bar {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }
    [data-theme="light"] .progress-bar { background: rgba(0,0,0,0.08); }
    .progress-fill {
      height: 100%;
      width: 38%;
      background: var(--accent);
      border-radius: 2px;
      position: relative;
    }
    .progress-time {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 8px;
    }
    .controls-lg {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .ctrl-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { color: var(--text-primary); background: var(--accent-soft); }
    .ctrl-btn.play {
      width: 60px; height: 60px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .ctrl-btn.play:hover { transform: scale(1.05); background: var(--accent); color: #fff; }
    .ctrl-btn svg { width: 22px; height: 22px; }
    .ctrl-btn.play svg { width: 26px; height: 26px; }

    .placeholder-view {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
    }
    .placeholder-icon {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .placeholder-icon svg { width: 28px; height: 28px; color: var(--accent); }
    .placeholder-title { font-size: 20px; font-weight: 500; }
    .placeholder-desc { font-size: 14px; color: var(--text-secondary); max-width: 280px; }

    .theme-view {
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .theme-options {
      display: flex;
      gap: 20px;
    }
    .theme-card {
      width: 160px;
      padding: 24px 20px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      text-align: center;
      transition: all 0.25s ease;
    }
    .theme-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
    .theme-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .theme-preview {
      width: 100%;
      height: 80px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .theme-preview.dark {
      background: linear-gradient(145deg, #0a0a0f, #1a1a28);
    }
    .theme-preview.light {
      background: linear-gradient(145deg, #f0f1f5, #ffffff);
      border: 1px solid rgba(0,0,0,0.06);
    }
    .theme-name { font-size: 14px; font-weight: 500; }

    .bottom-nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 20px;
      background: var(--bg-nav);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 22px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.22s ease;
      font-family: inherit;
      min-width: 72px;
    }
    .nav-item:hover { color: var(--text-secondary); background: var(--bg-card); }
    .nav-item.active {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-label { font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }

    @media (max-width: 900px) {
      .home-grid { grid-template-columns: 1fr; }
      .side-stack { flex-direction: row; }
      .weather-card, .music-mini { flex: 1; }
      .top-left, .top-right { min-width: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="top-left">
        <div class="status-item" title="Wi-Fi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1" fill="currentColor"/>
          </svg>
          <span>接続中</span>
        </div>
        <div class="alarm-chip" title="次のアラーム">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2 2"/>
            <path d="M5 3L2 6M22 6l-3-3"/>
          </svg>
          <span>7:00</span>
        </div>
      </div>

      <div class="top-center" id="top-time">02:49</div>

      <div class="top-right">
        <button class="icon-btn" id="theme-quick" title="ナイトモード切替">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="icon-btn" title="設定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="main-area">
      <div class="view active" id="view-home">
        <div class="home-grid">
          <div class="clock-card">
            <div class="clock-types">
              <button class="clock-type-btn active" data-type="digital">デジタル</button>
              <button class="clock-type-btn" data-type="analog">アナログ</button>
              <button class="clock-type-btn" data-type="minimal">ミニマル</button>
            </div>
            <div class="clock-digital" id="clock-digital">
              <div class="time-main">
                <span id="hours">02</span>:<span id="minutes">49</span><span class="time-seconds" id="seconds">00</span><span class="time-period" id="period">AM</span>
              </div>
              <div class="time-sub" id="date-sub">2026年11月16日 · 月曜日</div>
            </div>
            <div class="clock-analog" id="clock-analog">
              <div class="analog-face" id="analog-face">
                <div class="analog-center"></div>
                <div class="analog-hand hand-hour" id="hand-hour"></div>
                <div class="analog-hand hand-minute" id="hand-minute"></div>
                <div class="analog-hand hand-second" id="hand-second"></div>
              </div>
            </div>
            <div class="clock-minimal" id="clock-minimal">
              <div class="minimal-time" id="minimal-time">02:49</div>
              <div class="minimal-label">現在時刻</div>
            </div>
          </div>

          <div class="side-stack">
            <div class="weather-card">
              <div class="card-label">天気 · 登米市</div>
              <div class="weather-main">
                <div class="weather-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    <path d="M19 16a5 5 0 0 1-3 4.5"/>
                  </svg>
                </div>
                <div>
                  <div class="temp-value">8<span class="temp-unit">°</span></div>
                  <div class="weather-desc">曇りときどき晴れ</div>
                </div>
              </div>
              <div class="weather-details">
                <div class="weather-detail">
                  <div class="detail-label">体感</div>
                  <div class="detail-value">5°</div>
                </div>
                <div class="weather-detail">
                  <div class="detail-label">湿度</div>
                  <div class="detail-value">72%</div>
                </div>
                <div class="weather-detail">
                  <div class="detail-label">風速</div>
                  <div class="detail-value">2.1 m/s</div>
                </div>
                <div class="weather-detail">
                  <div class="detail-label">降水確率</div>
                  <div class="detail-value">10%</div>
                </div>
              </div>
            </div>

            <div class="music-mini" id="go-music">
              <div class="album-art-sm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
              </div>
              <div class="track-info-sm">
                <div class="track-title-sm">青のすみか</div>
                <div class="track-artist-sm">Tatsuya Kitani</div>
              </div>
              <button class="play-btn-sm" id="mini-play">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="view" id="view-music">
        <div class="music-view" style="display:flex; flex-direction:column; height:100%;">
          <div class="music-large">
            <div class="album-art-lg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
              </svg>
            </div>
            <div class="track-title-lg">青のすみか</div>
            <div class="track-artist-lg">Tatsuya Kitani · Apple Music</div>
            <div class="progress-wrap">
              <div class="progress-bar"><div class="progress-fill"></div></div>
              <div class="progress-time"><span>1:24</span><span>3:48</span></div>
            </div>
            <div class="controls-lg">
              <button class="ctrl-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button class="ctrl-btn play" id="main-play">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="ctrl-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="view" id="view-calendar">
        <div class="placeholder-view" style="display:flex; flex-direction:column; height:100%;">
          <div class="placeholder-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
          </div>
          <div class="placeholder-title">カレンダー</div>
          <div class="placeholder-desc">今後の予定やイベントをここに表示予定です</div>
        </div>
      </div>

      <div class="view" id="view-theme">
        <div class="theme-view" style="display:flex; flex-direction:column; height:100%;">
          <div class="placeholder-title" style="margin-bottom:8px;">テーマ</div>
          <div class="placeholder-desc" style="margin-bottom:24px;">見た目を切り替えられます</div>
          <div class="theme-options">
            <div class="theme-card active" data-theme-set="dark">
              <div class="theme-preview dark"></div>
              <div class="theme-name">ダーク</div>
            </div>
            <div class="theme-card" data-theme-set="light">
              <div class="theme-preview light"></div>
              <div class="theme-name">ライト</div>
            </div>
          </div>
        </div>
      </div>

      <div class="view" id="view-tools">
        <div class="placeholder-view" style="display:flex; flex-direction:column; height:100%;">
          <div class="placeholder-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </div>
          <div class="placeholder-title">ツール</div>
          <div class="placeholder-desc">便利なツールやショートカットをここに追加予定です</div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
        <span class="nav-label">ホーム</span>
      </button>
      <button class="nav-item" data-view="music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span class="nav-label">音楽</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span class="nav-label">カレンダー</span>
      </button>
      <button class="nav-item" data-view="theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span class="nav-label">テーマ</span>
      </button>
      <button class="nav-item" data-view="tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <span class="nav-label">ツール</span>
      </button>
    </nav>
  </div>

  <script>
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const periodEl = document.getElementById('period');
    const minimalTimeEl = document.getElementById('minimal-time');
    const topTimeEl = document.getElementById('top-time');
    const dateSubEl = document.getElementById('date-sub');
    const handHour = document.getElementById('hand-hour');
    const handMinute = document.getElementById('hand-minute');
    const handSecond = document.getElementById('hand-second');
    const weekdays = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const period = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;

      hoursEl.textContent = String(h12).padStart(2, '0');
      minutesEl.textContent = String(m).padStart(2, '0');
      secondsEl.textContent = String(s).padStart(2, '0');
      periodEl.textContent = period;
      minimalTimeEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      topTimeEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

      const hourDeg = (h % 12) * 30 + m * 0.5;
      const minuteDeg = m * 6 + s * 0.1;
      const secondDeg = s * 6;
      handHour.style.transform = `rotate(${hourDeg}deg)`;
      handMinute.style.transform = `rotate(${minuteDeg}deg)`;
      handSecond.style.transform = `rotate(${secondDeg}deg)`;

      dateSubEl.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${weekdays[now.getDay()]}`;
    }

    const analogFace = document.getElementById('analog-face');
    for (let i = 0; i < 12; i++) {
      const mark = document.createElement('div');
      mark.className = 'analog-mark major';
      mark.style.transform = `rotate(${i * 30}deg)`;
      analogFace.appendChild(mark);
    }
    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      const mark = document.createElement('div');
      mark.className = 'analog-mark';
      mark.style.transform = `rotate(${i * 6}deg)`;
      analogFace.appendChild(mark);
    }

    updateClock();
    setInterval(updateClock, 1000);

    document.querySelectorAll('.clock-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.clock-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.type;
        document.getElementById('clock-digital').style.display = type === 'digital' ? 'block' : 'none';
        document.getElementById('clock-analog').classList.toggle('active', type === 'analog');
        document.getElementById('clock-minimal').classList.toggle('active', type === 'minimal');
      });
    });

    const views = {
      home: document.getElementById('view-home'),
      music: document.getElementById('view-music'),
      calendar: document.getElementById('view-calendar'),
      theme: document.getElementById('view-theme'),
      tools: document.getElementById('view-tools')
    };

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        const viewName = item.dataset.view;
        Object.values(views).forEach(v => v.classList.remove('active'));
        views[viewName].classList.add('active');
      });
    });

    document.getElementById('go-music').addEventListener('click', (e) => {
      if (e.target.closest('.play-btn-sm')) return;
      document.querySelector('.nav-item[data-view="music"]').click();
    });

    let isDark = true;
    function setTheme(dark) {
      isDark = dark;
      document.documentElement.setAttribute('data-theme', dark ? '' : 'light');
      const icon = document.getElementById('theme-icon');
      if (dark) {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      } else {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
      }
      document.querySelectorAll('.theme-card').forEach(c => {
        c.classList.toggle('active', (c.dataset.themeSet === 'dark') === dark);
      });
    }

    document.getElementById('theme-quick').addEventListener('click', () => setTheme(!isDark));
    document.querySelectorAll('.theme-card').forEach(card => {
      card.addEventListener('click', () => setTheme(card.dataset.themeSet === 'dark'));
    });

    let isPlaying = false;
    function togglePlay(btn) {
      isPlaying = !isPlaying;
      const icon = isPlaying
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      document.getElementById('main-play').innerHTML = icon;
      document.getElementById('mini-play').innerHTML = icon;
    }
    document.getElementById('main-play').addEventListener('click', () => togglePlay());
    document.getElementById('mini-play').addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });
  </script>
</body>
</html>
