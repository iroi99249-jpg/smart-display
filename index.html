<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Dark theme (default) */
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b0;
      --text-muted: #6a6a7a;
      --accent: #7c9cff;
      --accent-soft: rgba(124, 156, 255, 0.15);
      --accent-glow: rgba(124, 156, 255, 0.25);
      --success: #5eead4;
      --warning: #fbbf24;
      --glass-blur: 24px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 20px;
      --radius-sm: 12px;
    }

    [data-theme="light"] {
      --bg-primary: #f4f5f8;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.7);
      --bg-card-hover: rgba(255, 255, 255, 0.9);
      --border: rgba(0, 0, 0, 0.06);
      --border-strong: rgba(0, 0, 0, 0.1);
      --text-primary: #1a1a2e;
      --text-secondary: #5a5a6e;
      --text-muted: #8a8a9a;
      --accent: #4f6ef7;
      --accent-soft: rgba(79, 110, 247, 0.12);
      --accent-glow: rgba(79, 110, 247, 0.2);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Subtle gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(124, 156, 255, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(94, 234, 212, 0.05), transparent);
      pointer-events: none;
      z-index: 0;
    }

    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(79, 110, 247, 0.06), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(94, 234, 212, 0.04), transparent);
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      padding: 28px 36px;
      gap: 24px;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-display {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .date-display .weekday {
      color: var(--text-muted);
      margin-left: 8px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      backdrop-filter: blur(var(--glass-blur));
    }

    .icon-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ===== Main Content ===== */
    .main {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      min-height: 0;
    }

    /* Clock Section */
    .clock-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--shadow);
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }

    .clock-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, var(--accent-soft), transparent 50%);
      opacity: 0.5;
      pointer-events: none;
    }

    .clock-types {
      display: flex;
      gap: 8px;
      margin-bottom: 36px;
      position: relative;
      z-index: 1;
    }

    .clock-type-btn {
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .clock-type-btn:hover {
      color: var(--text-secondary);
      border-color: var(--border-strong);
    }

    .clock-type-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Digital Clock */
    .clock-digital {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .time-main {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(64px, 9vw, 96px);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text-primary);
    }

    .time-seconds {
      font-size: 0.35em;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 4px;
    }

    .time-period {
      font-size: 0.28em;
      color: var(--text-secondary);
      font-weight: 400;
      margin-left: 12px;
      vertical-align: middle;
      letter-spacing: 0.05em;
    }

    .time-sub {
      margin-top: 16px;
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    /* Analog Clock */
    .clock-analog {
      display: none;
      position: relative;
      z-index: 1;
      width: 280px;
      height: 280px;
    }

    .clock-analog.active {
      display: block;
    }

    .analog-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      position: relative;
      background: var(--bg-card);
    }

    .analog-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .analog-hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }

    .hand-hour {
      width: 4px;
      height: 30%;
      background: var(--text-primary);
      margin-left: -2px;
    }

    .hand-minute {
      width: 3px;
      height: 40%;
      background: var(--text-secondary);
      margin-left: -1.5px;
    }

    .hand-second {
      width: 2px;
      height: 45%;
      background: var(--accent);
      margin-left: -1px;
    }

    .analog-mark {
      position: absolute;
      width: 2px;
      height: 10px;
      background: var(--text-muted);
      left: 50%;
      margin-left: -1px;
      transform-origin: center 140px;
    }

    .analog-mark.major {
      height: 14px;
      width: 3px;
      margin-left: -1.5px;
      background: var(--text-secondary);
    }

    /* Minimal Clock */
    .clock-minimal {
      display: none;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .clock-minimal.active {
      display: block;
    }

    .minimal-time {
      font-size: clamp(48px, 7vw, 72px);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }

    .minimal-label {
      margin-top: 12px;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* Right Column */
    .side-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Weather Card */
    .weather-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--shadow);
      padding: 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease;
    }

    .weather-card:hover {
      background: var(--bg-card-hover);
    }

    .card-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .weather-main {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
    }

    .weather-icon {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-icon svg {
      width: 56px;
      height: 56px;
      color: var(--accent);
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }

    .weather-temp {
      flex: 1;
    }

    .temp-value {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .temp-unit {
      font-size: 20px;
      color: var(--text-secondary);
      margin-left: 2px;
    }

    .weather-desc {
      margin-top: 6px;
      font-size: 15px;
      color: var(--text-secondary);
    }

    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: auto;
    }

    .weather-detail {
      background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border: 1px solid var(--border);
    }

    [data-theme="light"] .weather-detail {
      background: rgba(0, 0, 0, 0.02);
    }

    .detail-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* Music Card */
    .music-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .music-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .album-art {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2a2a3a, #1a1a28);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .album-art-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .album-art-placeholder svg {
      width: 28px;
      height: 28px;
      opacity: 0.5;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-source {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .track-source svg {
      width: 12px;
      height: 12px;
    }

    /* Progress */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }

    [data-theme="light"] .progress-bar {
      background: rgba(0, 0, 0, 0.08);
    }

    .progress-fill {
      height: 100%;
      width: 38%;
      background: var(--accent);
      border-radius: 2px;
      position: relative;
      transition: width 0.3s ease;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-glow);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .progress-bar:hover .progress-fill::after {
      opacity: 1;
    }

    .progress-time {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Controls */
    .music-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      color: var(--text-primary);
      background: var(--accent-soft);
    }

    .control-btn.play {
      width: 52px;
      height: 52px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .control-btn.play:hover {
      transform: scale(1.05);
      background: var(--accent);
      color: #fff;
    }

    .control-btn svg {
      width: 20px;
      height: 20px;
    }

    .control-btn.play svg {
      width: 22px;
      height: 22px;
    }

    /* ===== Footer ===== */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Responsive adjustments */
    @media (max-width: 1100px) {
      .main {
        grid-template-columns: 1fr;
      }
      .side-column {
        flex-direction: row;
      }
      .weather-card, .music-card {
        flex: 1;
      }
    }

    @media (max-width: 700px) {
      .app {
        padding: 20px;
      }
      .side-column {
        flex-direction: column;
      }
      .time-main {
        font-size: 56px;
      }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .clock-digital, .clock-analog, .clock-minimal {
      animation: fadeIn 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="date-display">
        <span id="full-date">2026年11月16日</span>
        <span class="weekday" id="weekday">月曜日</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-btn" title="テーマ切り替え">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="icon-btn" title="設定（準備中）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="main">
      <!-- Clock -->
      <section class="clock-section">
        <div class="clock-types">
          <button class="clock-type-btn active" data-type="digital">デジタル</button>
          <button class="clock-type-btn" data-type="analog">アナログ</button>
          <button class="clock-type-btn" data-type="minimal">ミニマル</button>
        </div>

        <!-- Digital -->
        <div class="clock-digital" id="clock-digital">
          <div class="time-main">
            <span id="hours">02</span>:<span id="minutes">33</span><span class="time-seconds" id="seconds">18</span><span class="time-period" id="period">AM</span>
          </div>
          <div class="time-sub" id="time-sub">Miyagi · Japan Standard Time</div>
        </div>

        <!-- Analog -->
        <div class="clock-analog" id="clock-analog">
          <div class="analog-face" id="analog-face">
            <div class="analog-center"></div>
            <div class="analog-hand hand-hour" id="hand-hour"></div>
            <div class="analog-hand hand-minute" id="hand-minute"></div>
            <div class="analog-hand hand-second" id="hand-second"></div>
          </div>
        </div>

        <!-- Minimal -->
        <div class="clock-minimal" id="clock-minimal">
          <div class="minimal-time" id="minimal-time">02:33</div>
          <div class="minimal-label">現在時刻</div>
        </div>
      </section>

      <!-- Side Column -->
      <div class="side-column">
        <!-- Weather -->
        <div class="weather-card">
          <div class="card-label">天気 · 登米市</div>
          <div class="weather-main">
            <div class="weather-icon">
              <!-- Partly cloudy night icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                <path d="M19 16a5 5 0 0 1-3 4.5"/>
              </svg>
            </div>
            <div class="weather-temp">
              <div class="temp-value">8<span class="temp-unit">°</span></div>
              <div class="weather-desc">曇りときどき晴れ</div>
            </div>
          </div>
          <div class="weather-details">
            <div class="weather-detail">
              <div class="detail-label">体感</div>
              <div class="detail-value">5°</div>
            </div>
            <div class="weather-detail">
              <div class="detail-label">湿度</div>
              <div class="detail-value">72%</div>
            </div>
            <div class="weather-detail">
              <div class="detail-label">風速</div>
              <div class="detail-value">2.1 m/s</div>
            </div>
            <div class="weather-detail">
              <div class="detail-label">降水確率</div>
              <div class="detail-value">10%</div>
            </div>
          </div>
        </div>

        <!-- Music -->
        <div class="music-card">
          <div class="card-label">再生中</div>
          <div class="music-header">
            <div class="album-art">
              <div class="album-art-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
              </div>
            </div>
            <div class="track-info">
              <div class="track-title">青のすみか</div>
              <div class="track-artist">Tatsuya Kitani</div>
              <div class="track-source">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                </svg>
                Apple Music
              </div>
            </div>
          </div>

          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
            <div class="progress-time">
              <span>1:24</span>
              <span>3:48</span>
            </div>
          </div>

          <div class="music-controls">
            <button class="control-btn" title="前へ">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
              </svg>
            </button>
            <button class="control-btn play" title="再生/一時停止">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </button>
            <button class="control-btn" title="次へ">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="status-text">Smart Display · UI Prototype</div>
      <div class="theme-toggle">
        <span id="theme-label">ダーク</span>
      </div>
    </footer>
  </div>

  <script>
    // ===== Clock Logic =====
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const periodEl = document.getElementById('period');
    const minimalTimeEl = document.getElementById('minimal-time');
    const fullDateEl = document.getElementById('full-date');
    const weekdayEl = document.getElementById('weekday');

    const handHour = document.getElementById('hand-hour');
    const handMinute = document.getElementById('hand-minute');
    const handSecond = document.getElementById('hand-second');

    const weekdays = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const period = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;

      // Digital
      hoursEl.textContent = String(h12).padStart(2, '0');
      minutesEl.textContent = String(m).padStart(2, '0');
      secondsEl.textContent = String(s).padStart(2, '0');
      periodEl.textContent = period;

      // Minimal
      minimalTimeEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

      // Analog
      const hourDeg = (h % 12) * 30 + m * 0.5;
      const minuteDeg = m * 6 + s * 0.1;
      const secondDeg = s * 6;
      handHour.style.transform = `rotate(${hourDeg}deg)`;
      handMinute.style.transform = `rotate(${minuteDeg}deg)`;
      handSecond.style.transform = `rotate(${secondDeg}deg)`;

      // Date
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      fullDateEl.textContent = `${year}年${month}月${day}日`;
      weekdayEl.textContent = weekdays[now.getDay()];
    }

    // Create analog marks
    const analogFace = document.getElementById('analog-face');
    for (let i = 0; i < 12; i++) {
      const mark = document.createElement('div');
      mark.className = 'analog-mark major';
      mark.style.transform = `rotate(${i * 30}deg)`;
      analogFace.appendChild(mark);
    }
    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      const mark = document.createElement('div');
      mark.className = 'analog-mark';
      mark.style.transform = `rotate(${i * 6}deg)`;
      analogFace.appendChild(mark);
    }

    updateClock();
    setInterval(updateClock, 1000);

    // ===== Clock Type Switch =====
    const typeBtns = document.querySelectorAll('.clock-type-btn');
    const digitalEl = document.getElementById('clock-digital');
    const analogEl = document.getElementById('clock-analog');
    const minimalEl = document.getElementById('clock-minimal');

    typeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        typeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.type;

        digitalEl.style.display = type === 'digital' ? 'block' : 'none';
        analogEl.classList.toggle('active', type === 'analog');
        minimalEl.classList.toggle('active', type === 'minimal');
      });
    });

    // ===== Theme Toggle =====
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');
    let isDark = true;

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? '' : 'light');
      themeLabel.textContent = isDark ? 'ダーク' : 'ライト';

      if (isDark) {
        themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      } else {
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        `;
      }
    });

    // ===== Music Play Button Toggle (visual only) =====
    const playBtn = document.querySelector('.control-btn.play');
    let isPlaying = false;
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        `;
      } else {
        playBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        `;
      }
    });
  </script>
</body>
</html>
