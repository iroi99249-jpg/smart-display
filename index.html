<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Display</title>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:24px;color:#888">Loading Smart Display…</p>
  <script>
  (async function(){
    try {
      const r = await fetch("./smart-display.html");
      if (!r.ok) throw new Error(r.status);
      const text = await r.text();
      document.open();
      document.write(text);
      document.close();
    } catch(e) {
      document.body.innerHTML = "<pre style=\"color:#f66;padding:24px\">Load error: "+e+"</pre>";
    }
  })();
  </script>
</body>
</html>
