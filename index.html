<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Display</title>
</head>
<body>
<script>
(async function () {
  const n = 5;
  for (let i = 0; i < n; i++) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'part' + i + '.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load part' + i));
      document.head.appendChild(s);
    });
  }
  const html = window.__SD_PARTS.join('');
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.body.textContent = 'Load error: ' + e;
});
</script>
</body>
</html>
